add_newline = true
format = """
$username$hostname:$directory$character"""
[username]
show_always = true
format = "[$user](bold #a6e3a1)"
[hostname]
ssh_only = false
format = "[@$hostname](bold #a6e3a1)"
[directory]
truncation_length = 5
format = "[$path](bold #89b4fa)"

[character]
success_symbol = "[\\$ ](bold #cba6f7)"
error_symbol = "[\\$ ](bold #f38ba8)"
