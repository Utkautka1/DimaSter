add_newline = true
format = """
$username$directory$git_branch$git_status$line_break$character"""
[username]
show_always = true
format = "[ $user ](bg:#cba6f7 fg:#11111b bold) "
[directory]
format = "[ $path ](bg:#313244 fg:#cdd6f4) "
[git_branch]
format = "[  $branch ](bg:#89b4fa fg:#11111b) "
[git_status]
format = "([$all_status$ahead_behind](#f9e2af) )"

[character]
success_symbol = "[➜ ](bold #cba6f7)"
error_symbol = "[➜ ](bold #f38ba8)"
