add_newline = true
format = """
$directory$git_branch$line_break$character"""
[directory]
format = "[\ue0b6](fg:#f38ba8)[$path](bg:#f38ba8 fg:#11111b)[\ue0b4](fg:#f38ba8) "
[git_branch]
format = "[\ue0b6](fg:#f9e2af)[ $branch](bg:#f9e2af fg:#11111b)[\ue0b4](fg:#f9e2af)"

[character]
success_symbol = "[➤ ](bold #cba6f7)"
error_symbol = "[➤ ](bold #f38ba8)"
