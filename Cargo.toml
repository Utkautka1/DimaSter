[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dimaster-vt = { path = "crates/dimaster-vt" }
dimaster-grid = { path = "crates/dimaster-grid" }
dimaster-pty = { path = "crates/dimaster-pty" }
dimaster-font = { path = "crates/dimaster-font" }
dimaster-render = { path = "crates/dimaster-render" }
dimaster-i18n = { path = "crates/dimaster-i18n" }
dimaster-image = { path = "crates/dimaster-image" }
dimaster-data = { path = "crates/dimaster-data" }
dimaster-docker = { path = "crates/dimaster-docker" }
dimaster-view = { path = "crates/dimaster-view" }
rustybuzz = "0.20"
regex = "1"
parking_lot = { version = "0.12", features = ["arc_lock"] }
dimaster-config = { path = "crates/dimaster-config" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
notify = "9"
toml = "1"
unicode-bidi = "0.3"
libc = "0.2"
winit = "0.30"
wgpu = "30"
fontdb = "0.24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", features = ["wayland-data-control"] }
log = "0.4"
env_logger = "0.11"
unicode-width = "0.2"
csv = "1"
rusqlite = { version = "0.43", features = ["bundled", "limits"] }
serde_json = { version = "1", features = ["preserve_order"] }
crossterm = "0.29"
arrow-array = "60"
arrow-cast = "60"
arrow-ipc = { version = "60", features = ["lz4", "zstd"] }
arrow-schema = "60"
bytes = "1"
calamine = { version = "0.38", features = ["chrono"] }
parquet = "60"
rust_xlsxwriter = "0.104"
rusty-leveldb = "4"
proptest = "1"
criterion = "0.7"

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
