[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
dimaster-vt = { path = "crates/dimaster-vt" }
dimaster-grid = { path = "crates/dimaster-grid" }
dimaster-pty = { path = "crates/dimaster-pty" }
dimaster-font = { path = "crates/dimaster-font" }
dimaster-render = { path = "crates/dimaster-render" }
dimaster-image = { path = "crates/dimaster-image" }
rustybuzz = "0.20"
unicode-bidi = "0.3"
libc = "0.2"
winit = "0.30"
wgpu = "30"
fontdb = "0.24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
arboard = { version = "3", features = ["wayland-data-control"] }
log = "0.4"
env_logger = "0.11"
unicode-width = "0.2"
proptest = "1"
criterion = "0.7"

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
